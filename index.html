<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Living Archive</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="grain"></div>

<!-- Legend bottom-left -->
<div id="leg-bl">

  <div class="li-bl on" data-d="film" onclick="doFilter('film',this)">
    <div class="li-bl-bar" style="background:var(--film)"></div>
    Film
  </div>

  <div class="li-bl on" data-d="art" onclick="doFilter('art',this)">
    <div class="li-bl-bar" style="background:var(--art)"></div>
    Public Art
  </div>

  <div class="li-bl on" data-d="craft" onclick="doFilter('craft',this)">
    <div class="li-bl-bar" style="background:var(--craft)"></div>
    Craft & Material
  </div>

  <div class="li-bl on" data-d="systems" onclick="doFilter('systems',this)">
    <div class="li-bl-bar" style="background:var(--systems)"></div>
    Systems
  </div>

  <div class="li-bl on" data-d="music" onclick="doFilter('music',this)">
    <div class="li-bl-bar" style="background:var(--music)"></div>
    Experimental
  </div>

</div>


<!-- Status key -->
<div id="sk">

  <div class="ski">
    <span>Upcoming</span>
    <div style="width:8px;height:8px;border-radius:50%;border:2px dashed #2a2a3a"></div>
  </div>

  <div class="ski">
    <span>In Progress</span>
    <div style="width:8px;height:8px;border-radius:50%;border:2px solid #464656"></div>
  </div>

  <div class="ski">
    <span>Completed</span>
    <div style="width:8px;height:8px;border-radius:50%;background:#44445a"></div>
  </div>

</div>


<div id="vp">

  <div id="world" class="zoom-overview">

    <svg id="svg-bg"></svg>

  </div>

</div>


<!-- Panel -->
<div id="panel">

  <div id="pa"></div>

  <div id="ph">

    <div id="ptag">
      <div id="ptbar"></div>
      <span id="ptn"></span>
    </div>

    <div id="ptitle"></div>

    <div id="pper"></div>

    <div id="pbadge">
      <div id="pbdot"></div>
      <span id="pbtext"></span>
    </div>

  </div>


  <div id="pb">

    <div class="ps">
      <div class="psl">Overview</div>
      <p id="pdesc"></p>
    </div>

    <div class="ps">
      <div class="psl">Learnings</div>
      <div id="plearn"></div>
    </div>

    <div class="ps">
      <div class="psl">Connections</div>
      <div class="cw" id="pconn"></div>
    </div>

  </div>

  <button id="pcls" onclick="closePanel()">x</button>

</div>


<div id="hint">

Click a trunk station to expand its branch

</div>


<!-- LOAD YOUR JAVASCRIPT -->
<script src="freefi.js"></script>

</body>
</html>
