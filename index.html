<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Map</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }
        .station {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #007bff;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }
        .line {
            position: absolute;
            background-color: #333;
            height: 2px;
        }
    </style>
</head>
<body>

<div class="station" style="top: 50px; left: 100px;"></div>
<div class="station" style="top: 50px; left: 200px;"></div>
<div class="station" style="top: 150px; left: 150px;"></div>
<div class="station" style="top: 200px; left: 100px;"></div>
<div class="station" style="top: 200px; left: 200px;"></div>

<div class="line" style="top: 60px; left: 110px; width: 90px;"></div>
<div class="line" style="top: 60px; left: 210px; width: 90px;"></div>
<div class="line" style="top: 160px; left: 110px; width: 40px;"></div>
<div class="line" style="top: 210px; left: 110px; width: 90px;"></div>

</body>
</html>
