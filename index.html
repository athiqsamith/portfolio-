
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Archive</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@300;400;500&family=Syne+Mono&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #050507;
  --surface: #0d0d10;
  --border:  #181820;
  --border2: #242430;
  --text:    #dcdce8;
  --muted:   #44445a;
  --film:    #f0c060;
  --art:     #e86060;
  --craft:   #60a8e8;
  --systems: #60e0a0;
  --music:   #c060e8;
  --trunk:   #b0b0c8;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  overflow: hidden;
}

/* dot grid */
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle, rgba(255,256,255,.04) 1px, transparent 1px);
  background-size: 44px 44px;
}

/* ── scrollable viewport, no drag, no free zoom ── */
#vp {
  position: fixed; inset: 0; z-index: 1;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
}
#vp::-webkit-scrollbar { display: none; }

#world {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100%;
  padding: 60px 20px 100px;
  /* zoom states */
  transition: transform .6s cubic-bezier(.16,1,.3,1);
}
#world.zoom-overview { transform: scale(1); transform-origin: center top; }
#world.zoom-focus    { transform: scale(1.15); transform-origin: center top; }

/* ── legend top-right ── */
#leg {
  position: fixed; top: 24px; right: 24px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
}
.li {
  display: flex; align-items: center; gap: 8px;
  font-family: 'Syne Mono', monospace;
  font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--muted); cursor: pointer; opacity: .5;
  transition: opacity .2s, color .2s;
}
.li:hover, .li.on { opacity: 1; }
.li-bar { width: 18px; height: 2px; border-radius: 1px; flex-shrink: 0; }

/* status key bottom-right */
#sk {
  position: fixed; bottom: 28px; right: 28px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
}
.ski {
  display: flex; align-items: center; gap: 7px;
  font-family: 'Syne Mono', monospace;
  font-size: 9px; letter-spacing: .08em; color: #44445a;
}

/* ── Trunk nodes ── */
.tn {
  position: absolute;
  display: flex; flex-direction: row; align-items: center;
  cursor: pointer;
  transform: translate(-50%, -50%);
}
.tn-ring {
  position: absolute;
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid #1e1e2c;
  transform: translate(-50%, -50%);
  left: 7px; top: 7px;
  pointer-events: none;
  transition: border-color .25s;
}
.tn:hover .tn-ring { border-color: #3a3a52; }
.tn.open .tn-ring  { border-color: var(--trunk); }
.tn-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--trunk);
  border: 2.5px solid var(--bg);
  flex-shrink: 0; position: relative; z-index: 2;
  transition: transform .2s, box-shadow .2s;
}
.tn:hover .tn-dot { transform: scale(1.35); box-shadow: 0 0 14px rgba(176,176,200,.45); }
.tn.open .tn-dot  { background: var(--bg); }
.tn-info { margin-left: 18px; }
.tn-lbl {
  font-family: 'Syne Mono', monospace; font-size: 9px;
  letter-spacing: .14em; text-transform: uppercase;
  color: #7070a0; white-space: nowrap;
  transition: color .2s;
}
.tn:hover .tn-lbl { color: #dcdce8; }
.tn-yr {
  font-family: 'Syne Mono', monospace; font-size: 8px;
  color: #383850; margin-top: 3px; letter-spacing: .08em;
}

/* ── Branch nodes ── */
.bn {
  position: absolute;
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer;
  transform: translate(-50%, -50%) scale(.3);
  opacity: 0; pointer-events: none;
  transition: opacity .4s cubic-bezier(.34,1.5,.64,1),
              transform .4s cubic-bezier(.34,1.5,.64,1);
}
.bn.vis {
  opacity: 1; pointer-events: all;
  transform: translate(50%, -50%) scale(1);
}
.bn-dot {
  width: 12px; height: 12px; border-radius: 50%;
  flex-shrink: 0; position: relative; z-index: 2;
  transition: transform .2s, box-shadow .2s;
}
.bn:hover .bn-dot { transform: scale(1.55); }
.bn:hover .bn-dot { box-shadow: 0 0 12px currentColor; }

.bn-lbl {
  font-family: 'Syne', sans-serif; font-size: 10px;
  color: #8888a8; white-space: pre; text-align: center;
  margin-top: 6px; line-height: 1.35;
  transition: color .2s; max-width: 120px;
}
.bn:hover .bn-lbl { color: #e8e8f8; }

@keyframes pr {
  0%   { transform: translate(-50%,-50%) scale(1); opacity: .5; }
  100% { transform: translate(-50%,-50%) scale(3.2); opacity: 0; }
}
.pulse {
  position: absolute; top: 50%; left: 50%;
  width: 12px; height: 12px; border-radius: 50%;
  border: 1px solid currentColor;
  animation: pr 2.4s ease-out infinite;
  pointer-events: none;
}

/* ── Legend bottom-left ── */
#leg-bl {
  position: fixed; bottom: 28px; left: 28px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 9px;
}
.li-bl {
  display: flex; align-items: center; gap: 9px;
  font-family: 'Syne Mono', monospace; font-size: 9px;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); cursor: pointer; opacity: .5;
  transition: opacity .2s, color .2s;
}
.li-bl:hover, .li-bl.on { opacity: 1; }
.li-bl-bar { width: 18px; height: 2px; border-radius: 1px; flex-shrink: 0; }

/* ── Panel ── */
#panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 350px;
  background: var(--surface); border-left: 1px solid var(--border);
  z-index: 300; transform: translateX(100%);
  transition: transform .45s cubic-bezier(.16,1,.3,1);
  display: flex; flex-direction: column;
}
#panel.open { transform: translateX(0); }
#pa  { height: 2px; flex-shrink: 0; }
#ph  { padding: 22px 22px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#ptag {
  font-family: 'Syne Mono', monospace; font-size: 8px;
  letter-spacing: .22em; text-transform: uppercase;
  display: flex; align-items: center; gap: 7px;
  color: var(--muted); margin-bottom: 10px;
}
#ptbar { width: 14px; height: 1.5px; border-radius: 1px; display: inline-block; }
#ptitle { font-weight: 500; font-size: 17px; line-height: 1.25; margin-bottom: 5px; }
#pper  { font-family: 'Syne Mono', monospace; font-size: 9px; color: var(--muted); }
#pbadge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Syne Mono', monospace; font-size: 8px;
  letter-spacing: .14em; text-transform: uppercase;
  margin-top: 11px; padding: 4px 10px;
  border: 1px solid var(--border); border-radius: 20px; color: var(--muted);
}
#pbdot { width: 5px; height: 5px; border-radius: 50%; }
#pb {
  padding: 22px; overflow-y: auto; flex: 1;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.ps { margin-bottom: 26px; }
.psl {
  font-family: 'Syne Mono', monospace; font-size: 8px;
  letter-spacing: .18em; text-transform: uppercase;
  color: #1e1e2c; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.psl::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.ps p { font-size: 12px; line-height: 1.85; color: #585870; }
.li2 {
  font-family: 'Syne Mono', monospace; font-size: 10px;
  color: #484860; padding: 6px 0; border-bottom: 1px solid var(--border);
  line-height: 1.6; display: flex; gap: 7px; align-items: flex-start;
}
.li2::before { content: '->'; color: #222230; flex-shrink: 0; }
.cw { display: flex; flex-wrap: wrap; gap: 6px; }
.cc {
  font-family: 'Syne Mono', monospace; font-size: 8px; letter-spacing: .08em;
  padding: 4px 9px; border-radius: 2px;
  border: 1px solid var(--border); color: var(--muted);
  cursor: pointer; transition: all .15s;
}
.cc:hover { color: var(--text); border-color: var(--border2); }
#pcls {
  position: absolute; top: 16px; right: 16px;
  width: 26px; height: 26px; background: var(--border); border: none;
  border-radius: 2px; color: var(--muted); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne Mono', monospace; transition: all .15s;
}
#pcls:hover { background: var(--border2); color: var(--text); }

/* hint */
#hint {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  font-family: 'Syne Mono', monospace; font-size: 9px;
  letter-spacing: .18em; text-transform: uppercase; color: #383850;
  pointer-events: none; z-index: 200; transition: opacity 1.5s;
  white-space: nowrap;
}
#hint.gone { opacity: 0; }

/* grain */
#grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 1000; opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}
</style>
</head>
<body>
<div id="grain"></div>

<!-- Legend bottom-left -->
<div id="leg-bl">
  <div class="li-bl on" data-d="film"    onclick="doFilter('film',this)">    <div class="li-bl-bar" style="background:var(--film)"></div>Film</div>
  <div class="li-bl on" data-d="art"     onclick="doFilter('art',this)">     <div class="li-bl-bar" style="background:var(--art)"></div>Public Art</div>
  <div class="li-bl on" data-d="craft"   onclick="doFilter('craft',this)">   <div class="li-bl-bar" style="background:var(--craft)"></div>Craft &amp; Material</div>
  <div class="li-bl on" data-d="systems" onclick="doFilter('systems',this)"> <div class="li-bl-bar" style="background:var(--systems)"></div>Systems</div>
  <div class="li-bl on" data-d="music"   onclick="doFilter('music',this)">   <div class="li-bl-bar" style="background:var(--music)"></div>Experimental</div>
</div>

<!-- Status key bottom-right -->
<div id="sk">
  <div class="ski"><span>Upcoming</span>    <div style="width:8px;height:8px;border-radius:50%;border:2px dashed #2a2a3a"></div></div>
  <div class="ski"><span>In Progress</span> <div style="width:8px;height:8px;border-radius:50%;border:2px solid #464656"></div></div>
  <div class="ski"><span>Completed</span>   <div style="width:8px;height:8px;border-radius:50%;background:#44445a"></div></div>
</div>

<div id="vp">
  <div id="world" class="zoom-overview">
    <svg id="svg-bg"></svg>
  </div>
</div>

<div id="panel">
  <div id="pa"></div>
  <div id="ph">
    <div id="ptag"><div id="ptbar"></div><span id="ptn"></span></div>
    <div id="ptitle"></div>
    <div id="pper"></div>
    <div id="pbadge"><div id="pbdot"></div><span id="pbtext"></span></div>
  </div>
  <div id="pb">
    <div class="ps"><div class="psl">Overview</div><p id="pdesc"></p></div>
    <div class="ps"><div class="psl">Learnings</div><div id="plearn"></div></div>
    <div class="ps"><div class="psl">Connections</div><div class="cw" id="pconn"></div></div>
  </div>
  <button id="pcls" onclick="closePanel()">x</button>
</div>

<div id="hint">Click a trunk station to expand its branch</div>

<script>
// ============================================================
// DATA  (same as metro-v2.html — unchanged)
// ============================================================
const C = {
  film:'#f0c060', art:'#e86060', craft:'#60a8e8',
  systems:'#60e0a0', music:'#c060e8', trunk:'#b0b0c8'
};
const LNAMES = {
  film:'Film Line', art:'Public Art', craft:'Craft & Material',
  systems:'Systems', music:'Experimental', trunk:'Trunk'
};
const SC = { completed:'#44445a', 'in-progress':'#f0c060', upcoming:'#252535' };

const TRUNK = [
  { id:'T1', label:'Origins',      year:'2012',
    desc:'The beginning. Making things with hands, camera, and curiosity.',
    learned:["Curiosity as engine","Beginner's mind"], related:[],
    branch:{ disc:'craft', dir:'left', stations:[
      { id:'Bc1', label:'Woodworking',       status:'completed',   ox:-120, oy:-90,  period:'2012-2014',
        desc:'Built furniture by hand. Material resistance as teacher.',
        learned:['Grain and structure','Hand tool mastery','Patience through resistance'], related:['Bc2','T1'] },
      { id:'Bc2', label:'Textile\n& Weaving',status:'completed',   ox:-220, oy:-170, period:'2015-2016',
        desc:'Six months in a weaving studio. Rhythm as meditative practice.',
        learned:['Pattern logic','Tactile intelligence','Repetition as composition'], related:['Bc1','Bc3'] },
      { id:'Bc3', label:'Ceramics',          status:'completed',   ox:-130, oy:-260, period:'2017-2019',
        desc:'Clay as thinking medium. Embracing imperfection.',
        learned:['Mass vs void','Glaze chemistry','Process over outcome'], related:['Bc2','Bc4'] },
      { id:'Bc4', label:'Material\nResearch',status:'in-progress', ox:-260, oy:-200, period:'2022-Now',
        desc:'Bio-materials and sustainable fabrication. Where craft meets futures.',
        learned:['Mycelium composites','Speculative design'], related:['Bc3'] },
    ]}
  },
  { id:'T2', label:'First Camera', year:'2014',
    desc:'Borrowed a DSLR. Shot everything. Learned how light behaves.',
    learned:['Exposure triangle','Watching before shooting','Light as material'], related:['T3'],
    branch:{ disc:'film', dir:'right', stations:[
      { id:'Bf1', label:'Short Films',          status:'completed',   ox:120,  oy:-90,  period:'2014-2016',
        desc:'Three short films. Story is infrastructure.',
        learned:['Screenwriting basics','Directing non-actors','Post-production flow'], related:['Bf2','T2'] },
      { id:'Bf2', label:'Documentary',          status:'completed',   ox:230,  oy:-170, period:'2017-2019',
        desc:'Shifted to non-fiction. Months in archives and in the field.',
        learned:['Ethics of representation','Interview technique','Archival research'], related:['Bf1','Bf3'] },
      { id:'Bf3', label:'Collaborative\nCinema',status:'in-progress', ox:120,  oy:-270, period:'2022-Now',
        desc:'Co-creating visual narratives with communities.',
        learned:['Collective authorship','Trust building'], related:['Bf2','Bf4'] },
      { id:'Bf4', label:'Feature\nDev',         status:'upcoming',    ox:260,  oy:-210, period:'2025-',
        desc:'Developing first feature-length hybrid documentary/fiction project.',
        learned:[], related:['Bf3'] },
    ]}
  },
  { id:'T3', label:'Public Space', year:'2016',
    desc:'First work in public. A wall, a community, six weeks of negotiation.',
    learned:['Scale and perception','Art in contested spaces'], related:['T2','T4'],
    branch:{ disc:'art', dir:'left', stations:[
      { id:'Ba1', label:'Street Murals',           status:'completed',   ox:-110, oy:-90,  period:'2016-2017',
        desc:'First public intervention. Community centre wall.',
        learned:['Community negotiation','Durability of materials','Scale as argument'], related:['Ba2','T3'] },
      { id:'Ba2', label:'Festival\nDesign',        status:'completed',   ox:-220, oy:-170, period:'2018-2020',
        desc:'Spatial experiences for cultural festivals. Temporary architecture.',
        learned:['Crowd psychology','Modular systems','Temporal design'], related:['Ba1','Ba3'] },
      { id:'Ba3', label:'Permanent\nInstall',      status:'in-progress', ox:-120, oy:-265, period:'2023-Now',
        desc:'First permanent public commission. City-scale work with residents.',
        learned:['Institutional navigation','Longevity of material'], related:['Ba2','Ba4'] },
      { id:'Ba4', label:'International\nResidency',status:'upcoming',    ox:-255, oy:-210, period:'2025-',
        desc:'Residency in unfamiliar city. Site-specific work.',
        learned:[], related:['Ba3'] },
    ]}
  },
  { id:'T4', label:'First Studio', year:'2018',
    desc:'Started a studio. Creativity without infrastructure collapses.',
    learned:['Pricing work','Client communication','Legal basics'], related:['T3','T5'],
    branch:{ disc:'systems', dir:'right', stations:[
      { id:'Bs1', label:'Studio\nOps',          status:'completed',   ox:120,  oy:-90,  period:'2018-2020',
        desc:'Built the studio from scratch. Operating creatively and commercially.',
        learned:['Estimating projects','Contracts','Cashflow management'], related:['Bs2','T4'] },
      { id:'Bs2', label:'Collaborator\nNetwork', status:'completed',   ox:235,  oy:-175, period:'2019-2021',
        desc:'Loose network of collaborators operating without fixed team.',
        learned:['Trust networks','Async collaboration','Project scoping'], related:['Bs1','Bs3'] },
      { id:'Bs3', label:'Sustainable\nPractice', status:'in-progress', ox:120,  oy:-270, period:'2022-Now',
        desc:'Redesigning how the practice generates income without compromising work.',
        learned:['Grants & funding','Licensing creative work','Saying no'], related:['Bs2','Bs4'] },
      { id:'Bs4', label:'Teaching &\nMentoring', status:'upcoming',    ox:265,  oy:-215, period:'2025-',
        desc:'Formalizing knowledge sharing. Workshops and curriculum.',
        learned:[], related:['Bs3'] },
    ]}
  },
  { id:'T5', label:'Sound Work',   year:'2020',
    desc:'Picked up a field recorder. Sound as archive and material.',
    learned:['Listening as practice','Ambience as composition'], related:['T4'],
    branch:{ disc:'music', dir:'left', stations:[
      { id:'Bm1', label:'Field\nRecording',    status:'completed',   ox:-110, oy:-90,  period:'2020-2021',
        desc:'Carried a recorder everywhere. The world as score.',
        learned:['Spatial acoustics','Deep listening','Sound as archive'], related:['Bm2','T5'] },
      { id:'Bm2', label:'Generative\nScores',  status:'completed',   ox:-225, oy:-170, period:'2021-2022',
        desc:'Field recordings as input to generative systems.',
        learned:['Max/MSP basics','Algorithmic composition','Live setups'], related:['Bm1','Bm3'] },
      { id:'Bm3', label:'Sound\nfor Film',     status:'in-progress', ox:-120, oy:-265, period:'2023-Now',
        desc:'Composing and designing sound for film and installation.',
        learned:['DAW deep work','Emotional scoring'], related:['Bm2','Bm4'] },
      { id:'Bm4', label:'Live A/V\nPerformance',status:'upcoming',   ox:-260, oy:-215, period:'2025-',
        desc:'Live format merging field recordings, visuals, and improvisation.',
        learned:[], related:['Bm3'] },
    ]}
  },
];

// flat lookup
const NM = {};
TRUNK.forEach(t => {
  NM[t.id] = t;
  if (t.branch) t.branch.stations.forEach(s => { s._disc = t.branch.disc; s._trunk = t; NM[s.id] = s; });
});

// ============================================================
// LAYOUT  — vertical spine
// ============================================================
const NS     = 'http://www.w3.org/2000/svg';
const CX     = 340;   // spine x in SVG space
const STEP   = 160;   // vertical gap between trunk stations
const PAD_T  = 80;
const SVG_W  = 760;

// Compute absolute positions
TRUNK.forEach((t, i) => {
  t.ax = CX;
  t.ay = PAD_T + i * STEP;
});
TRUNK.forEach(t => {
  if (!t.branch) return;
  t.branch.stations.forEach(s => {
    s.ax = t.ax + s.ox;
    s.ay = t.ay + s.oy;
  });
});

const LAST_Y   = TRUNK[TRUNK.length - 1].ay;
// find topmost branch node
let topMost = PAD_T;
TRUNK.forEach(t => { if (t.branch) t.branch.stations.forEach(s => { if (s.ay < topMost) topMost = s.ay; }); });
const EXTRA   = Math.max(0, 60 - topMost);
const SVG_H   = LAST_Y + 100 + EXTRA;

// shift everything down if needed
if (EXTRA > 0) {
  TRUNK.forEach(t => {
    t.ay += EXTRA;
    if (t.branch) t.branch.stations.forEach(s => { s.ay += EXTRA; });
  });
}

// ============================================================
// SVG SETUP
// ============================================================
const svg = document.getElementById('svg-bg');
svg.setAttribute('width',  SVG_W);
svg.setAttribute('height', SVG_H);
svg.style.cssText = `width:min(96vw,${SVG_W}px);height:auto;display:block;overflow:visible;`;

function mkSvg(tag, a) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(a)) e.setAttribute(k, v);
  return e;
}

// ── DEFS ──
const defs = mkSvg('defs', {});

// vertical gradient for spine
const vg = mkSvg('linearGradient', {id:'vg', x1:'0%', y1:'0%', x2:'0%', y2:'100%'});
[
  {o:'0%',   c:'#050507', a:0},
  {o:'4%',   c:'#6060a0', a:1},
  {o:'30%',  c:'#e0e0ff', a:1},
  {o:'72%',  c:'#c0c0e0', a:1},
  {o:'96%',  c:'#6060a0', a:1},
  {o:'100%', c:'#050507', a:0},
].forEach(s => {
  vg.appendChild(mkSvg('stop', {offset:s.o,'stop-color':s.c,'stop-opacity':s.a}));
});
defs.appendChild(vg);

// glow filter for spine
const fSp = mkSvg('filter', {id:'fspine', x:'-500%', y:'-1%', width:'1100%', height:'102%'});
fSp.appendChild(mkSvg('feGaussianBlur', {stdDeviation:'7', in:'SourceGraphic', result:'b'}));
const fm1 = mkSvg('feMerge', {});
fm1.appendChild(mkSvg('feMergeNode', {in:'b'}));
fm1.appendChild(mkSvg('feMergeNode', {in:'SourceGraphic'}));
fSp.appendChild(fm1);
defs.appendChild(fSp);

// node hover glow filter
const fNd = mkSvg('filter', {id:'fnode', x:'-100%', y:'-100%', width:'300%', height:'300%'});
fNd.appendChild(mkSvg('feGaussianBlur', {stdDeviation:'3.5', in:'SourceGraphic'}));
defs.appendChild(fNd);

svg.appendChild(defs);

// ── SPINE  (perfectly straight vertical line) ──
// glow layer
svg.appendChild(mkSvg('line', {
  x1:CX, y1:0, x2:CX, y2:SVG_H,
  stroke:'url(#vg)', 'stroke-width':'22',
  filter:'url(#fspine)', opacity:'.18',
  'stroke-linecap':'round'
}));
// crisp spine — 6px
svg.appendChild(mkSvg('line', {
  x1:CX, y1:0, x2:CX, y2:SVG_H,
  stroke:'url(#vg)', 'stroke-width':'6',
  'stroke-linecap':'round'
}));

// blinking bottom dot
const bd = mkSvg('circle', {cx:CX, cy:SVG_H - 16, r:'5', fill:'#c0c0e8'});
bd.appendChild(mkSvg('animate', {attributeName:'opacity', values:'1;0.05;1', dur:'2s', repeatCount:'indefinite'}));
svg.appendChild(bd);

// ── BRANCH SVG GROUPS  (start CLOSED, toggle on trunk click) ──
const BG = {};
const expanded = new Set();

TRUNK.forEach(t => {
  if (!t.branch) return;
  const col = C[t.branch.disc];
  const g   = mkSvg('g', {id:'bg-'+t.id});
  g.style.opacity = '0';
  g.style.transition = 'opacity .35s';

  t.branch.stations.forEach((s, i) => {
    const fromX = i === 0 ? t.ax : t.branch.stations[i-1].ax;
    const fromY = i === 0 ? t.ay : t.branch.stations[i-1].ay;

    // elbow: from→horizontal to s.ax→vertical to s.ay
    g.appendChild(mkSvg('polyline', {
      points: `${fromX},${fromY} ${s.ax},${fromY} ${s.ax},${s.ay}`,
      stroke: col, 'stroke-width':'2', fill:'none',
      'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:'.75'
    }));
  });

  svg.appendChild(g);
  BG[t.id] = g;
  // NOTE: NOT adding to expanded — starts closed
});

// ============================================================
// DOM NODES
// ============================================================
const world = document.getElementById('world');
// The SVG is already a child of world — nodes go beside it via absolute positioning
// We'll wrap everything in a relative container
const container = document.createElement('div');
container.style.cssText = `position:relative;width:${SVG_W}px;height:${SVG_H}px;flex-shrink:0;`;
world.appendChild(container);
// move svg into container
container.appendChild(svg);

// Trunk nodes
TRUNK.forEach(t => {
  const el = document.createElement('div');
  el.className = 'tn open'; // open = branch expanded
  el.id = 'n-' + t.id;
  el.style.left = t.ax + 'px';
  el.style.top  = t.ay + 'px';

  const ring = document.createElement('div'); ring.className = 'tn-ring';
  const dot  = document.createElement('div'); dot.className  = 'tn-dot';
  if (t.branch) dot.style.borderColor = C[t.branch.disc] + '88';

  const info = document.createElement('div'); info.className = 'tn-info';
  const lbl  = document.createElement('div'); lbl.className = 'tn-lbl'; lbl.textContent = t.label;
  const yr   = document.createElement('div'); yr.className  = 'tn-yr';  yr.textContent  = t.year;
  info.append(lbl, yr);
  el.append(ring, dot, info);

  el.addEventListener('click', e => {
    e.stopPropagation();
    if (t.branch) toggleBranch(t);
    else openPanel(t, null);
  });
  container.appendChild(el);
});

// Branch nodes (start HIDDEN, shown when branch expanded)
TRUNK.forEach(t => {
  if (!t.branch) return;
  const col = C[t.branch.disc];
  const isLeft = t.branch.dir === 'left';

  t.branch.stations.forEach(s => {
    const el = document.createElement('div');
    el.className = 'bn'; // NOT vis — starts hidden
    el.id = 'n-' + s.id;
    el.style.left  = s.ax + 'px';
    el.style.top   = s.ay + 'px';
    el.style.color = col;

    if (s.status === 'in-progress') {
      const p = document.createElement('div');
      p.className = 'pulse'; p.style.color = col;
      el.appendChild(p);
    }

    const d = document.createElement('div'); d.className = 'bn-dot';
    if      (s.status === 'completed')   { d.style.background = col; }
    else if (s.status === 'in-progress') { d.style.border = '2.5px solid '+col; d.style.background = 'transparent'; }
    else                                  { d.style.border = '2px dashed #4a4a60'; d.style.background = 'transparent'; }

    const lb = document.createElement('div');
    lb.className = 'bn-lbl';
    lb.textContent = s.label.replace(/\n/g, ' ');
    // align label based on branch direction
    lb.style.textAlign = isLeft ? 'right' : 'left';

    el.addEventListener('mouseenter', () => d.style.boxShadow = `0 0 14px ${col}`);
    el.addEventListener('mouseleave', () => d.style.boxShadow = '');

    el.append(d, lb);
    el.addEventListener('click', e => { e.stopPropagation(); openPanel(s, t); });
    container.appendChild(el);
  });
});

// ============================================================
// BRANCH TOGGLE
// ============================================================
function toggleBranch(t) {
  expanded.has(t.id) ? collapseBranch(t) : expandBranch(t);
}

function expandBranch(t) {
  expanded.add(t.id);
  document.getElementById('n-'+t.id).classList.add('open');
  BG[t.id].style.opacity = '1';
  t.branch.stations.forEach((s, i) => {
    setTimeout(() => {
      const el = document.getElementById('n-'+s.id);
      if (el) el.classList.add('vis');
    }, 40 + i * 70);
  });
}

function collapseBranch(t) {
  expanded.delete(t.id);
  document.getElementById('n-'+t.id).classList.remove('open');
  BG[t.id].style.opacity = '0';
  t.branch.stations.forEach(s => {
    const el = document.getElementById('n-'+s.id);
    if (el) el.classList.remove('vis');
  });
}

// ============================================================
// ZOOM STATES
// ============================================================
function setZoom(state) {
  document.getElementById('world').className = 'zoom-' + state;
}

// ============================================================
// PANEL
// ============================================================
function openPanel(node, parentTrunk) {
  setZoom('focus');
  const disc = parentTrunk ? parentTrunk.branch.disc : 'trunk';
  const col  = C[disc];

  document.getElementById('pa').style.background    = col;
  document.getElementById('ptbar').style.background = col;
  document.getElementById('ptn').textContent        = LNAMES[disc];
  document.getElementById('ptitle').textContent     = (node.label||'').replace(/\n/g,' ');
  document.getElementById('pper').textContent       = node.period || node.year || '';
  document.getElementById('pdesc').textContent      = node.desc || '';

  const st = node.status || 'completed';
  document.getElementById('pbdot').style.background = SC[st] || col;
  document.getElementById('pbtext').textContent     = st.replace('-',' ');

  const pl = document.getElementById('plearn');
  pl.innerHTML = '';
  const lrn = node.learned || [];
  if (lrn.length) {
    lrn.forEach(l => { const d=document.createElement('div');d.className='li2';d.textContent=l;pl.appendChild(d); });
  } else {
    pl.innerHTML='<div style="font-size:10px;color:#1e1e2c;font-family:Syne Mono,monospace">-- not yet written --</div>';
  }

  const pc = document.getElementById('pconn');
  pc.innerHTML = '';
  (node.related||[]).forEach(rid => {
    const r = NM[rid]; if (!r) return;
    const chip = document.createElement('div');
    chip.className = 'cc';
    chip.textContent = (r.label||'').replace(/\n/g,' ');
    chip.onclick = () => {
      const pt = r._trunk || null;
      openPanel(r, pt);
    };
    pc.appendChild(chip);
  });

  document.getElementById('panel').classList.add('open');
  document.getElementById('hint').classList.add('gone');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  setZoom('overview');
}

// ============================================================
// FILTER
// ============================================================
let activeFilter = null;

function doFilter(disc, btn) {
  if (activeFilter === disc) {
    activeFilter = null;
    document.querySelectorAll('.li-bl').forEach(l => l.classList.add('on'));
    TRUNK.forEach(t => {
      document.getElementById('n-'+t.id).style.opacity = '1';
      if (t.branch) {
        BG[t.id].style.opacity = '1';
        t.branch.stations.forEach(s => { document.getElementById('n-'+s.id).style.opacity = ''; });
      }
    });
  } else {
    activeFilter = disc;
    document.querySelectorAll('.li-bl').forEach(l => l.classList.toggle('on', l.dataset.d === disc));
    TRUNK.forEach(t => {
      const match = t.branch && t.branch.disc === disc;
      document.getElementById('n-'+t.id).style.opacity = match ? '1' : '0.1';
      if (t.branch) {
        BG[t.id].style.opacity = match ? '1' : '0.04';
        t.branch.stations.forEach(s => {
          document.getElementById('n-'+s.id).style.opacity = match ? '' : '0.06';
        });
      }
    });
  }
}

// close panel on backdrop click
document.getElementById('vp').addEventListener('click', () => closePanel());

// fade hint
setTimeout(() => document.getElementById('hint').classList.add('gone'), 5000);
</script>
</body>
</html>
