<script>
// Updated script section
// SVG circle markers to represent branch lines
const svgNamespace = 'http://www.w3.org/2000/svg';

function createCircle(x, y) {
    const circle = document.createElementNS(svgNamespace, 'circle');
    circle.setAttribute('cx', x);
    circle.setAttribute('cy', y);
    circle.setAttribute('r', '5');
    circle.setAttribute('fill', 'blue'); // Change color as needed
    return circle;
}

function drawLineWithNodes(startX, startY, endX, endY) {
    const line = document.createElementNS(svgNamespace, 'line');
    line.setAttribute('x1', startX);
    line.setAttribute('y1', startY);
    line.setAttribute('x2', endX);
    line.setAttribute('y2', endY);
    line.setAttribute('stroke', 'black'); // Line color

    // Calculate mid-point for circle position
    const midX = (startX + endX) / 2;
    const midY = (startY + endY) / 2;

    const circle = createCircle(midX, midY);
    document.getElementById('svgContainer').appendChild(line);
    document.getElementById('svgContainer').appendChild(circle);
}

// Call drawLineWithNodes with appropriate coordinates for each branch
// Add your specific coordinates below: 
// drawLineWithNodes(startX, startY, endX, endY);
</script>
